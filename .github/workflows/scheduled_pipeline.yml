name: Scheduled Quotes Pipeline

on:
  schedule:
    # Run Monday to Friday at 12:00 and 18:00 UTC (market hours)
    - cron: "0 12,18 * * 1-5"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ETL Pipeline (SQLite & Parquet)
        run: |
          python pipeline.py --storage sqlite
          python pipeline.py --storage parquet

      - name: Upload processed data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quotes-data
          path: data/processed/
          retention-days: 30

